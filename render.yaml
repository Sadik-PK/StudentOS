services:
  - type: web
    name: studentos-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build:server
    startCommand: npm run db:deploy && npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://studentos-api-hkml.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://student-os-phi-bice.vercel.app
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_OPENAI_MODEL
        value: gpt-4o-mini
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_REDIRECT_URI
        value: https://studentos-api-hkml.onrender.com/api/integrations/google-drive/callback
      - key: GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_DRIVE_ADMIN_EMAIL
        sync: false
