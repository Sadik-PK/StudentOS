services:
  - type: web
    name: studentos-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build:server
    startCommand: npm run db:deploy && npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://studentos-api-hkml.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://student-os-phi-bice.vercel.app
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
